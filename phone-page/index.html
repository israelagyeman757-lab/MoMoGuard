<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1a1e">
  <meta name="description" content="Walɔ feature phone simulator — a simulated SIM Toolkit, not a live MTN connection.">
  <title>Walɔ · Feature phone simulator</title>
  <link rel="stylesheet" href="/phone-page/styles.css">
</head>
<body>
  <main class="stage">
    <div class="phone-slot" id="phone_slot">
      <div class="phone" id="phone" aria-label="Simulated MTN feature phone">
        <div class="earpiece" aria-hidden="true"></div>
        <div class="front-camera" aria-hidden="true"></div>

        <div class="lcd-bezel">
          <div class="lcd" id="lcd">
            <div class="lcd-status" id="lcd_status" aria-hidden="true"></div>
            <div class="lcd-body" id="lcd_body" aria-live="polite"></div>
            <div class="lcd-softbar"><span id="soft_left"></span><span id="soft_right"></span></div>
          </div>
        </div>

        <div class="mtn-badge" aria-hidden="true"><span>MTN</span></div>

        <div class="nav-block">
          <div class="soft-row">
            <button class="softkey" id="key_soft_left" data-key="soft-left" aria-label="Left soft key"></button>
            <div class="dpad" role="group" aria-label="Direction pad">
              <button class="dpad-arrow up" id="key_up" data-key="up" aria-label="Up"></button>
              <button class="dpad-arrow left" id="key_left" data-key="left" aria-label="Left"></button>
              <button class="ok" id="key_ok" data-key="ok" aria-label="OK">OK</button>
              <button class="dpad-arrow right" id="key_right" data-key="right" aria-label="Right"></button>
              <button class="dpad-arrow down" id="key_down" data-key="down" aria-label="Down"></button>
            </div>
            <button class="softkey" id="key_soft_right" data-key="soft-right" aria-label="Right soft key"></button>
          </div>
          <div class="call-row">
            <button class="pill call" id="key_call" data-key="call" aria-label="Call">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 3.8 9 7.5 6.8 10c1.3 2.8 3.4 4.9 6.2 6.2l2.5-2.2 3.7 3.8-.8 3c-.2.8-1 1.3-1.8 1.2C9.4 21.1 2.9 14.6 2 6.4c-.1-.8.4-1.6 1.2-1.8l2-.8Z"/></svg>
            </button>
            <button class="pill end" id="key_end" data-key="end" aria-label="End">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15l3.2-3.7c4.7-2 9.9-2 14.6 0L24 15l-4 4-3.8-2.8v-2.4a17 17 0 0 0-8.4 0v2.4L4 19l-1-4Z"/></svg>
            </button>
          </div>
        </div>

        <div class="keypad" aria-label="Keypad">
          <button class="numkey" id="key_1" data-key="1" aria-label="1">
            <span class="digit">1</span>
            <span class="sub"><svg class="mini" viewBox="0 0 14 14" aria-hidden="true"><circle cx="4" cy="5" r="1.2"/><circle cx="9" cy="4" r="1"/><circle cx="11" cy="8" r="1"/><circle cx="3" cy="10" r="1"/><path d="M6 7h3"/></svg></span>
          </button>
          <button class="numkey" id="key_2" data-key="2" aria-label="2"><span class="digit">2</span><span class="sub">abc</span></button>
          <button class="numkey" id="key_3" data-key="3" aria-label="3"><span class="digit">3</span><span class="sub">def</span></button>
          <button class="numkey" id="key_4" data-key="4" aria-label="4"><span class="digit">4</span><span class="sub">ghi</span></button>
          <button class="numkey" id="key_5" data-key="5" aria-label="5"><span class="digit">5</span><span class="sub">jkl</span></button>
          <button class="numkey" id="key_6" data-key="6" aria-label="6"><span class="digit">6</span><span class="sub">mno</span></button>
          <button class="numkey" id="key_7" data-key="7" aria-label="7"><span class="digit">7</span><span class="sub">pqrs</span></button>
          <button class="numkey" id="key_8" data-key="8" aria-label="8"><span class="digit">8</span><span class="sub">tuv</span></button>
          <button class="numkey" id="key_9" data-key="9" aria-label="9"><span class="digit">9</span><span class="sub">wxyz</span></button>
          <button class="numkey" id="key_star" data-key="*" aria-label="Star"><span class="digit">*</span><span class="sub">+</span></button>
          <button class="numkey" id="key_0" data-key="0" aria-label="Zero"><span class="digit">0</span><span class="sub">–</span></button>
          <button class="numkey" id="key_hash" data-key="#" aria-label="Hash"><span class="digit">#</span><span class="sub"><svg class="mini" viewBox="0 0 14 14" aria-hidden="true"><rect x="3" y="6" width="8" height="6" rx="1.2"/><path d="M5 6V4.5a2 2 0 0 1 4 0V6"/></svg></span></button>
        </div>

        <div class="mic" aria-hidden="true"></div>
      </div>
    </div>

  </main>

  <script type="module" src="/phone-page/app.js"></script>
</body>
</html>
