<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#D32F2F">
  <meta name="description" content="MoMoGuard Innovate Reps — Walo community rep console on a smartphone shell.">
  <title>MoMoGuard — Innovate Reps · Walo</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="demo_toast" class="demo-toast" role="status" aria-live="polite"></div>

  <header class="page-header">
    <div class="brand" aria-label="MoMoGuard">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 36" role="img"><path d="M16 2 29 7v10c0 8.4-5.3 14.1-13 17C8.3 31.1 3 25.4 3 17V7L16 2Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="m10 17 4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span>MoMoGuard<span class="brand-dot">.</span></span>
    </div>
    <span class="header-tag">Innovate Reps · Walo</span>
  </header>

  <main class="showcase">
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">Community rep smartphone</h1>
      <p class="intro-copy">Dock: Phone, Messages, Walo. Simulated SMS and calls from
        <a href="../demo-control/index.html" target="_blank" rel="noopener">demo-control ↗</a>.</p>
    </section>

    <section class="phone-stage" aria-label="Innovate Reps smartphone simulator">
      <div class="phone-shadow" aria-hidden="true"></div>
      <div class="smartphone" id="smartphone">
        <div class="smartphone-bezel">
          <div class="smartphone-status">
            <span class="status-time" id="status_time">09:41</span>
            <span><span class="status-network" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="status_battery">84%</span></span>
          </div>
          <div class="smartphone-screen" id="smartphone_screen">
            <div id="shell_home" class="shell-layer shell-home"></div>
            <div id="shell_phone" class="shell-layer" hidden></div>
            <div id="shell_messages" class="shell-layer" hidden></div>
            <div id="shell_walo" class="shell-layer" hidden></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="page-footer">
    <span>Reports → community intelligence · Lookups → Glance (stub)</span>
    <span id="footer_note">Controller: http://127.0.0.1:8000</span>
  </footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
